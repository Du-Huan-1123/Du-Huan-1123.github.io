baseURL = 'https://du-huan-1123.github.io/'
languageCode = 'zh-cn'
title = '技术分享'
theme = 'PaperMod'

[pagination]
pagerSize = 10

[params]
env = 'production'
description = '记录技术学习与思考'
author = 'Du Huan'

# 显示设置
defaultTheme = 'auto'
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecialInSearch = true
disableScrollToTop = false

# 首页设置
showFullContent = false
hideSummary = false
hideMeta = false

# 搜索配置
[params.fuse]
threshold = 0.2
location = 0
distance = 1000
ignoreFieldLocation = true

# 主页简介
[params.homeInfoParams]
Title = "你好，欢迎来到我的博客 👋"
Content = "这里记录我在交通数据分析、深度学习、软件工程方面的学习与实践。"

# 社交图标
[[params.socialIcons]]
name = "github"
title = "GitHub"
url = "https://github.com/Du-Huan-1123"

[[params.socialIcons]]
name = "email"
title = "Email"
url = "mailto:2060578353@qq.com"

# 菜单
[menu]
[[menu.main]]
identifier = "home"
name = "🏠 首页"
url = "/"
weight = 1

[[menu.main]]
identifier = "archives"
name = "📦 归档"
url = "/archives/"
weight = 5

[[menu.main]]
identifier = "tags"
name = "🏷️ 标签"
url = "/tags/"
weight = 10

[[menu.main]]
identifier = "search"
name = "🔍 搜索"
url = "/search/"
weight = 15

[[menu.main]]
identifier = "about"
name = "👤 关于"
url = "/about/"
weight = 20

# 输出格式
[outputs]
home = ["HTML", "RSS", "JSON"]

# 代码高亮
[markup]
[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = false
noClasses = true
style = "monokai"
tabWidth = 4
