baseURL = 'https://du-huan-1123.github.io/'
languageCode = 'zh-cn'
title = '技术分享'
theme = 'PaperMod'

[pagination]
pagerSize = 10

[params]
env = 'production'
description = '记录技术学习与思考'
author = 'Du Huan'

# 显示设置
defaultTheme = 'auto'
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecialInSearch = true
disableScrollToTop = false

# 首页设置
showFullContent = false
hideSummary = false
hideMeta = false

# 搜索配置
[params.fuse]
threshold = 0.2
location = 0
distance = 1000
ignoreFieldLocation = true

# 主页简介
[params.homeInfoParams]
Title = "你好，我是 Du Huan 👋"
Content = "一名热爱技术的工程师，专注于交通数据分析、深度学习和软件工程。这里记录我的学习历程和技术思考。"

# 技能标签
[[params.skills]]
name = "Python"
delay = "0"

[[params.skills]]
name = "深度学习"
delay = "0.2"

[[params.skills]]
name = "Seq2Seq"
delay = "0.4"

[[params.skills]]
name = "数据分析"
delay = "0.6"

[[params.skills]]
name = "Vue.js"
delay = "0.8"

[[params.skills]]
name = "Docker"
delay = "1"

[[params.skills]]
name = "Linux"
delay = "1.2"

[[params.skills]]
name = "Git"
delay = "1.4"

# 社交图标
[[params.socialIcons]]
name = "github"
title = "GitHub"
url = "https://github.com/Du-Huan-1123"

[[params.socialIcons]]
name = "envelope"
title = "Email"
url = "mailto:2060578353@qq.com"

# 菜单
[menu]
[[menu.main]]
identifier = "home"
name = "🏠 首页"
url = "/"
weight = 1

[[menu.main]]
identifier = "tech"
name = "💻 技术分析"
url = "/tech/"
weight = 5

[[menu.main]]
identifier = "projects"
name = "🚀 项目展示"
url = "/projects/"
weight = 10

[[menu.main]]
identifier = "search"
name = "🔍 搜索"
url = "/search/"
weight = 20

[[menu.main]]
identifier = "about"
name = "👤 关于"
url = "/about/"
weight = 25

# 输出格式
[outputs]
home = ["HTML", "RSS", "JSON"]

# 代码高亮
[markup]
[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = false
noClasses = true
style = "monokai"
tabWidth = 4
